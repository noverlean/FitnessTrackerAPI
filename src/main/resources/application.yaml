spring:
  application:
    name: Fitness Tracker API

  server:
    port: 8080
    error:
      include-message: always
      include-binding-errors: always

  datasource:
    url: jdbc:postgresql://localhost:5432/fitness_db
    username: admin
    password: 12345678
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  security:
    user:
      name: admin
      password: 123secret321

  liquibase:
    change-log: classpath:db/changelog/master.yaml

jwt:
  secret: ${JWT_SECRET:defaultsecretkeyfortestdeployandcheck}
  access:
    expiration: 900_000 # 15 минут
  refresh:
    expiration: 1_296_000_000 # 15 дней